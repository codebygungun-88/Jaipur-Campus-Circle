<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaipur Campus Circle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #fff4f3;
      color: #30262a;
      font-family: "Poppins", sans-serif;
    }
  </style>
  <body>
    <header class="px-4 sm:px-6"> 
  <!-- Navbar -->
  <nav class="w-full  mx-auto rounded-[50px] mt-3 bg-white px-5 md:px-8 py-4 shadow-sm">

    <div class="flex flex-col lg:flex-row items-center justify-between gap-5">

      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-[#9B5265] rounded-full flex items-center justify-center text-white shrink-0">
          <i class="fa-solid fa-users text-xl"></i>
        </div>

        <h1 class="text-xl sm:text-2xl font-bold text-[#9B5265]">
          Jaipur Campus Circle
        </h1>
      </div>

      <div class="flex flex-wrap justify-center gap-x-5 gap-y-3 text-sm sm:text-base text-[#30262A]">

         <a href="index.html" class="hover:text-pink-800 font-bold">Home</a>
        <a href="universities.html" class="hover:text-pink-800 font-bold">Universities</a>
        <a href="commmunity.html" class="hover:text-pink-800 font-bold">Communities</a>
        <a href="contact.html" class="hover:text-pink-800 font-bold">Events</a>
        <a href="about.html" class="hover:text-pink-800 font-bold">About</a>

      </div>

      <button class="bg-[#9B5265] text-white px-6 py-3 rounded-full hover:bg-pink-800 transition whitespace-nowrap">
        Join Community
      </button>

    </div>
  </nav>
</header>
 <main>

  <!-- Section-1 -->

  <section
  class="w-full bg-rose-50 py-20 px-8"
>
  <div
    class="max-w-7xl mx-auto flex items-center justify-between gap-12"
  >
    <!-- Left Content -->
    <div class="w-1/2">
      <span
        class="inline-block bg-rose-100 text-rose-700 px-5 py-2 rounded-full text-sm font-semibold mb-6"
      >
        ✨ Jaipur Student Community
      </span>

      <h1
        class="text-5xl font-bold text-gray-900 leading-tight mb-6"
      >
        Find Your People, <br />
        Build Your <span class="text-rose-600">Community.</span>
      </h1>

      <p class="text-gray-600 text-lg leading-8 mb-8">
        Connect with students across Jaipur, share ideas,
        explore opportunities and create unforgettable
        campus experiences together.
      </p>

      <div class="flex gap-4">
        <a
          href="#community"
          class="bg-rose-600 text-white px-7 py-3 rounded-full font-semibold hover:bg-rose-700 duration-300"
        >
          Explore Community
        </a>

        <a
          href="#about"
          class="border border-rose-600 text-rose-600 px-7 py-3 rounded-full font-semibold hover:bg-rose-100 duration-300"
        >
          Learn More
        </a>
      </div>
    </div>

    <!-- Right Image -->
    <div class="w-1/2">
      <img
        src="https://media.istockphoto.com/id/1461631542/photo/group-of-happy-students-having-chat-with-talking-each-other-while-sitting-on-college-campus.jpg?s=612x612&w=0&k=20&c=nB1wuPB-JuX3YIdoNSJDRgolfbiqQu2Tjj_kdUor_pE="
        alt="Students enjoying campus life"
        class="w-full h-[430px] object-cover rounded-[30px] shadow-xl"
      />
    </div>
  </div>
</section>
 </main>


  </body>
</html>
