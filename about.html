<!doctype html>

  <body>

  <!-- Navbar -->
  <nav class="w-full max-w-7xl mx-auto rounded-[50px] mt-3 bg-white px-5 md:px-8 py-4 shadow-sm">

    <div class="flex flex-col lg:flex-row items-center justify-between gap-5">

      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-[#9B5265] rounded-full flex items-center justify-center text-white shrink-0">
          <i class="fa-solid fa-users text-xl"></i>
        </div>

        <h1 class="text-xl sm:text-2xl font-bold text-[#9B5265]">
          Jaipur Campus Circle
        </h1>
      </div>

      <div class="flex flex-wrap justify-center gap-x-5 gap-y-3 text-sm sm:text-base text-[#30262A]">

        <a href="index.html" class="hover:text-pink-800 font-bold">Home</a>
        <a href="universities.html" class="hover:text-pink-800 font-bold">Universities</a>
        <a href="commmunity.html" class="hover:text-pink-800 font-bold">Communities</a>
        <a href="contact.html" class="hover:text-pink-800 font-bold">Events</a>

  <div class="w-1/2">
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6M1CHWJiYZorx6c9xjoT-ilhnj8hOhQMFqvJJNmLhUg&s=10"
