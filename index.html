<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jaipur Campus Circle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #fff4f3;
      color: #30262a;
      font-family: "Poppins", sans-serif;
    }
  </style>
  <body>
    <header class="px-4 sm:px-6"> 
  <!-- Navbar -->
  <nav class="w-full max-w-7xl mx-auto rounded-[50px] mt-3 bg-white px-5 md:px-8 py-4 shadow-sm">

    <div class="flex flex-col lg:flex-row items-center justify-between gap-5">

      <!-- Logo -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-[#9B5265] rounded-full flex items-center justify-center text-white shrink-0">
          <i class="fa-solid fa-users text-xl"></i>
        </div>

        <h1 class="text-xl sm:text-2xl font-bold text-[#9B5265]">
          Jaipur Campus Circle
        </h1>
      </div>

      <div class="flex flex-wrap justify-center gap-x-5 gap-y-3 text-sm sm:text-base text-[#30262A]">

        <a href="index.html" class="hover:text-pink-800 font-bold">Home</a>
        <a href="universities.html" class="hover:text-pink-800 font-bold">Universities</a>
        <a href="commmunity.html" class="hover:text-pink-800 font-bold">Communities</a>
        <a href="contact.html" class="hover:text-pink-800 font-bold">Events</a>
        <a href="about.html" class="hover:text-pink-800 font-bold">About</a>

      </div>

      <button class="bg-[#9B5265] text-white px-6 py-3 rounded-full hover:bg-pink-800 transition whitespace-nowrap">
        Join Community
      </button>

    </div>
  </nav>
</header>  

<main>

 <!-- Section-1 -->

    <section class="w-full flex flex-col lg:flex-row items-center justify-between gap-12 px-5 sm:px-8 lg:px-12 py-12 md:py-16">

  <div class="w-full lg:w-1/2">

    <h3 class="w-fit text-xs sm:text-sm font-bold text-pink-200 bg-pink-700 px-4 py-2 rounded-full">
      Jaipur Student Community
    </h3>

    <h2 class="mt-5 text-4xl sm:text-5xl lg:text-[50px] font-bold leading-tight">
      Your Campus, <br />
      <span class="text-pink-800 italic">Our Community.</span>
    </h2>

    <p class="mt-4 max-w-[500px] text-base sm:text-lg">
      Connect with students, discover exciting events
      and explore opportunities across Jaipur.
    </p>

    <div class="flex flex-wrap gap-4 mt-6">

      <button class="flex items-center gap-2 bg-pink-700 px-5 py-4 text-sm sm:text-[15px] text-white rounded-full hover:scale-105 duration-300">
        Explore Communities
        <i class="fa-solid fa-arrow-right-long"></i>
      </button>

      <button class="flex items-center gap-2 border border-pink-700 px-5 py-4 text-sm sm:text-[15px] text-black rounded-full hover:scale-105 duration-300">
        <i class="fa-solid fa-calendar-days text-pink-800"></i>
        Upcoming Events
      </button>

    </div>

    <div class="flex flex-wrap mt-8 gap-y-5">

      <div class="text-center border-r-2 border-pink-800 px-4 sm:px-8">
        <i class="fa-solid fa-users text-pink-800"></i>
        <h3 class="font-bold text-lg mt-2">10K+</h3>
        <p class="text-xs">Students</p>
      </div>

      <div class="text-center border-r-2 border-pink-800 px-4 sm:px-8">
        <i class="fa-solid fa-calendar-days text-pink-800"></i>
        <h3 class="font-bold text-lg mt-2">100+</h3>
        <p class="text-xs">Events</p>
      </div>

      <div class="text-center px-4 sm:px-8">
        <i class="fa-solid fa-landmark-dome text-pink-800"></i>
        <h3 class="font-bold text-lg mt-2">20+</h3>
        <p class="text-xs">Colleges</p>
      </div>

    </div>

  </div>

  <div class="relative w-full lg:w-1/2">

    <img
      src="/images/Screenshot 2026-11-13 201947.png"
      alt="Students connecting"
      class="rounded-[20px] w-full max-w-[700px] mx-auto object-cover"
    />

    <div class="border w-[150px] h-[50px] text-center rounded-[20px] p-3 text-lg font-bold text-white bg-pink-700 absolute top-3 left-3 hover:scale-105 duration-300">
      Connect now
    </div>

  </div>

</section>
</main>


  </body>
</html>
